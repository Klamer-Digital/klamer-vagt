# Vagten bag vagten (plan, milepæl 14): kalder hubbens /api/health hvert kvarter og fejler, hvis
# hubben ikke svarer 200, hvis ok ikke er true, eller hvis drift-jobbet ikke er LYKKEDES i 30 min
# (driftAlderMinutter = hele minutter siden seneste vellykkede kørsel; en fejlet kørsel giver ok=false).
#
# VIGTIGT:
# - GitHub kører kun planlagte workflows (schedule) fra standardgrenen (main). Filen skal derfor
#   også ligge på main; på andre grene kan den kun køres i hånden (workflow_dispatch).
# - Mail ved fejl: GitHub sender notifikationer for planlagte workflows til den bruger, der sidst
#   ændrede cron-linjen i denne fil (oprindeligt den, der oprettede workflowet). Bliver workflowet
#   slået fra og til igen, går de i stedet til den, der slog det til. Den bruger skal være Lucas,
#   så det er Lucas' GitHub-konto, der skal pushe/merge ændringer af cron-linjen.
# - Lucas skal have Actions-notifikationer slået til: github.com → Settings → Notifications →
#   "Actions" → Email (gerne "Only notify for failed workflows").
# - GitHub kan forsinke eller springe planlagte kørsler over ved høj belastning; derfor tåler
#   tjekket én udeblevet drift-kørsel (30 min), og hvert kald prøves to gange.
#
# Ingen secrets: ruten er offentlig og svarer kun med status og tidsstempler.
#
# Hvert punkt i matrix.include tjekkes for sig med samme tjek (fail-fast er slået fra, så ét nede
# punkt ikke skjuler et andet). marketing-mcp's /healthz svarer {"ok":true} uden drift-alder.
name: Hub-vagt

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-vagt
  cancel-in-progress: false

jobs:
  vagt:
    name: ${{ matrix.navn }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - navn: Hubbens /api/health
            url: https://klamer-hub-production.up.railway.app/api/health
          - navn: marketing-mcp på Hetzner, /healthz
            url: https://marketing-mcp.hub.klamer-digital.dk/healthz
    env:
      NAVN: ${{ matrix.navn }}
      HEALTH_URL: ${{ matrix.url }}
      MAKS_ALDER_MIN: "30"
    steps:
      - name: Tjek hubben og drift-jobbet (2 forsøg)
        run: |
          set -u
          tjek() {
            status=$(curl -sS -o svar.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "$HEALTH_URL") || status="000"
            if [ "$status" != "200" ]; then
              echo "::warning::HTTP $status fra $HEALTH_URL"
              return 1
            fi
            if ! jq -e --argjson maks "$MAKS_ALDER_MIN" \
              '.ok == true and ((.driftAlderMinutter == null) or (.driftAlderMinutter <= $maks))' svar.json > /dev/null; then
              echo "::warning::Hubben svarede, men er ikke sund:"
              jq -c '{ok, tjek, driftAlderMinutter}' svar.json || true
              return 1
            fi
            jq -c '{ok, version, tjek, driftAlderMinutter}' svar.json
          }
          if tjek; then exit 0; fi
          sleep 30
          if tjek; then exit 0; fi
          echo "::error::$NAVN er nede eller ikke sund ($HEALTH_URL). For hubben kan det også være, at drift-jobbet ikke har kørt i over $MAKS_ALDER_MIN min."
          exit 1

  # Nattens backup af Klamer Hub-serveren (hub-repoet, infra/server/backup.sh). Serveren skriver
  # status.json efter hver kørsel. Alarm (rødt job, og dermed GitHub-mail som for de andre punkter),
  # når den seneste kørsel mislykkedes, når den seneste vellykkede er ældre end MAKS_ALDER_TIMER,
  # når den aldrig er kørt (status findes ikke), eller når statussen ikke kan hentes. 30 timer
  # tåler én forsinket natkørsel. Ingen secrets: filen er offentlig og viser kun ok og tidspunkter.
  backup:
    name: Nattens backup
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      STATUS_URL: https://hub.klamer-digital.dk/_backup/status.json
      MAKS_ALDER_TIMER: "30"
    steps:
      - name: Tjek at den seneste backup lykkedes og ikke er for gammel (2 forsøg)
        run: |
          set -u
          tjek() {
            status=$(curl -sS -o status.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "$STATUS_URL") || status="000"
            if [ "$status" != "200" ]; then
              echo "::warning::HTTP $status fra $STATUS_URL (er backuppen aldrig kørt?)"
              return 1
            fi
            if ! jq -e '.ok == true' status.json > /dev/null; then
              echo "::warning::Seneste backup mislykkedes:"
              jq -c '{ok, lastSuccess, lastAttempt, fejl}' status.json || true
              return 1
            fi
            if ! jq -e --argjson maks "$MAKS_ALDER_TIMER" \
              '.lastSuccess != null and ((now - (.lastSuccess | fromdateiso8601)) / 3600 <= $maks)' status.json > /dev/null; then
              echo "::warning::Seneste vellykkede backup er for gammel (over $MAKS_ALDER_TIMER timer) eller mangler:"
              jq -c '{ok, lastSuccess, lastAttempt}' status.json || true
              return 1
            fi
            jq -c '{ok, lastSuccess}' status.json
          }
          if tjek; then exit 0; fi
          sleep "${RETRY_SLEEP:-30}"
          if tjek; then exit 0; fi
          echo "::error::Backuppen er mislykket, for gammel eller aldrig kørt ($STATUS_URL)."
          exit 1
